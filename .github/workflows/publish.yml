name: Publish to Instagram

# 월·수·금 19:00 KST (= 10:00 UTC) 발행
# 아래는 2026-08-18 하루 10편 발행을 위한 1회성 항목 — 그날 밤 이후 정리 예정.
# (queue.json에 pending 항목이 없으면 그냥 종료되므로, 못 지워도 무해함)
on:
  schedule:
    - cron: "0 10 * * 1,3,5"
    - cron: "40 8 18 8 *"  # 17:40 KST — morning-light
    - cron: "20 9 18 8 *"  # 18:20 KST — resale-value
    - cron: "0 10 18 8 *"  # 19:00 KST — ultra-processed-food
    - cron: "40 10 18 8 *" # 19:40 KST — shoulder-fit
    - cron: "20 11 18 8 *" # 20:20 KST — step-count
    - cron: "0 12 18 8 *"  # 21:00 KST — coffee-mortality
    - cron: "40 12 18 8 *" # 21:40 KST — laundry-labels
    - cron: "20 13 18 8 *" # 22:20 KST — visceral-fat
    - cron: "0 14 18 8 *"  # 23:00 KST — alcohol-limits
    # 오늘 10편의 릴스 버전 — 8/19~8/22, 하루 2~3개씩 분산 발행. 끝난 뒤 정리 예정.
    - cron: "15 0 19 8 *"  # 8/19 09:15 KST
    - cron: "15 5 19 8 *"  # 8/19 14:15 KST
    - cron: "15 11 19 8 *" # 8/19 20:15 KST
    - cron: "15 0 20 8 *"  # 8/20 09:15 KST
    - cron: "15 5 20 8 *"  # 8/20 14:15 KST
    - cron: "15 11 20 8 *" # 8/20 20:15 KST
    - cron: "15 1 21 8 *"  # 8/21 10:15 KST
    - cron: "15 10 21 8 *" # 8/21 19:15 KST
    - cron: "15 1 22 8 *"  # 8/22 10:15 KST
    - cron: "15 10 22 8 *" # 8/22 19:15 KST
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글 강제 발행 (비우면 큐에서 자동 선택)"
        required: false
      dry_run:
        description: "실제 발행 없이 점검만"
        type: boolean
        default: false
      reel:
        description: "캐러셀 대신 릴스(mp4)로 발행 (slug 필수)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          ARGS=""
          [ -n "${{ inputs.slug }}" ] && ARGS="$ARGS --slug ${{ inputs.slug }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.reel }}" = "true" ] && ARGS="$ARGS --reel"
          python3 scripts/publish.py $ARGS

      # 발행 결과를 큐에 반드시 반영한다.
      # 이 push 가 실패하면 remote 큐에 pending 이 남아, 다음 크론이 같은 글을
      # 또 발행한다(2026-08-22 bib-gourmand 중복 발행이 이 경로였다).
      # 그래서 rebase 후 재시도하고, 그래도 안 되면 잡을 실패시켜 눈에 띄게 한다.
      - name: Update queue
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet && exit 0
          git commit -m "publish: mark posted"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "큐 반영 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — rebase 후 재시도 ($i/5)"
            git pull --rebase --autostash || exit 1
            sleep $((i * 3))
          done
          echo "::error::큐 반영 실패 — remote 에 pending 이 남아 중복 발행 위험이 있습니다"
          exit 1
