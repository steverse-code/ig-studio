name: Publish to Instagram

# 30분마다 큐를 훑어서, publish_at 이 지난 pending 1건을 발행한다.
#
# 이 리포지토리는 로컬 Mac 없이 클라우드만으로 돌아간다 (PIPELINE.md 참고):
#   클라우드 스케줄 에이전트가 콘텐츠를 써서 push
#     → render.yml 이 이미지를 렌더링해서 commit
#     → 이 워크플로가 다음 30분 안에 발행
# 그래서 발행 시각은 "글이 큐에 들어온 시점 + 최대 30분"이지, 고정 크론 시각이 아니다.
# 특정 시각에 맞추고 싶으면 큐 항목의 publish_at 을 미래로 잡아두면 된다.
#
# pending 이 없으면 아무것도 하지 않고 끝나므로, 자주 도는 것 자체는 무해하다.
# (public 리포지토리라 Actions 사용량 과금도 없다)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글 강제 발행 (비우면 큐에서 자동 선택)"
        required: false
      dry_run:
        description: "실제 발행 없이 점검만"
        type: boolean
        default: false
      reel:
        description: "캐러셀 대신 릴스(mp4)로 발행 (slug 필수)"
        type: boolean
        default: false

permissions:
  contents: write

# 러너는 UTC 로 동작한다. 봇 커밋의 author/committer 시각이 UTC 로 찍히면
# 사용자가 KST 로 남긴 커밋과 섞여 git log 순서가 뒤죽박죽으로 보인다.
env:
  TZ: Asia/Seoul

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          ARGS=""
          [ -n "${{ inputs.slug }}" ] && ARGS="$ARGS --slug ${{ inputs.slug }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.reel }}" = "true" ] && ARGS="$ARGS --reel"
          python3 scripts/publish.py $ARGS

      # 발행 결과를 큐에 반드시 반영한다.
      # 이 push 가 실패하면 remote 큐에 pending 이 남아, 다음 크론이 같은 글을
      # 또 발행한다(2026-08-22 bib-gourmand 중복 발행이 이 경로였다).
      # 그래서 rebase 후 재시도하고, 그래도 안 되면 잡을 실패시켜 눈에 띄게 한다.
      - name: Update queue
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet && exit 0
          git commit -m "publish: mark posted"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "큐 반영 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — rebase 후 재시도 ($i/5)"
            git pull --rebase --autostash || exit 1
            sleep $((i * 3))
          done
          echo "::error::큐 반영 실패 — remote 에 pending 이 남아 중복 발행 위험이 있습니다"
          exit 1
