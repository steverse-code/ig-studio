name: Daily content watchdog

# daily-content.yml 의 예약 실행(schedule)이 GitHub 쪽 스케줄러 부하로 아예
# 건너뛰어지는 경우가 있다 (지연이 아니라 드롭 — 2026-08-27 오전 그라운드제로가
# 이 케이스였다: deep-dive-korea 는 5시간 반 늦게라도 돌았지만 이쪽은 실행
# 이력 자체가 없었다). 이 워치독은 각 슬롯 목표 시각에서 50분 지난 시점에
# "오늘 이 슬롯이 이미 돌았는가"를 확인하고, 안 돌았으면 대신 workflow_dispatch
# 로 실행시킨다. 50분은 관측된 정상 지연 폭(20~50분대)을 넘는 값으로 잡았다.
on:
  schedule:
    - cron: "50 0 * * *"   # 00:50 UTC = 09:50 KST — 오전 슬롯 점검
    - cron: "50 6 * * *"   # 06:50 UTC = 15:50 KST — 오후 슬롯 점검
  workflow_dispatch:

permissions:
  actions: write   # 안 돌았을 때 daily-content.yml 을 대신 실행시키는 데 필요
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 슬롯 결정
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "50 0 * * *") SLOT=am; SINCE="$(date -u +%Y-%m-%dT00:00:00Z)" ;;
            "50 6 * * *") SLOT=pm; SINCE="$(date -u +%Y-%m-%dT06:00:00Z)" ;;
            *)
              echo "workflow_dispatch 로 직접 실행됨 — 점검을 건너뛴다"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "오늘 $SLOT 슬롯, $SINCE 이후 실행 이력을 확인한다"

      - name: 오늘 이 슬롯이 이미 돌았는지 확인
        id: check
        if: steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh run list --repo "${{ github.repository }}" \
            --workflow=daily-content.yml \
            --json createdAt \
            --jq "[.[] | select(.createdAt >= \"${{ steps.slot.outputs.since }}\")] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "오늘 이 슬롯 실행 이력: ${COUNT}건"

      - name: 안 돌았으면 대신 실행
        if: steps.slot.outputs.skip != 'true' && steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "이번 ${{ steps.slot.outputs.slot }} 슬롯이 예정 시각에서 50분이 지나도록"
          echo "한 번도 실행되지 않았다. 워치독이 대신 실행시킨다."
          gh workflow run daily-content.yml --repo "${{ github.repository }}" \
            -f slot="${{ steps.slot.outputs.slot }}" -f dry_run=false
